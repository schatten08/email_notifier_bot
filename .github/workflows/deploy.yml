name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/my_bot/email_notifier_bot
            git fetch origin main
            git reset --hard origin/main
            # Пересобираем образ и перезапускаем через docker-compose (v1, docker compose v2 plugin не установлен на сервере)
            # --force-recreate обязателен: без него docker-compose может оставить старый контейнер
            # запущенным со старым CMD/entrypoint, даже если образ пересобран (см. инцидент 2026-08-04)
            sudo docker-compose up -d --build --force-recreate
            # Очистка старых образов для экономии места
            sudo docker image prune -f
