name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/my_bot/email_notifier_bot
            git fetch origin main
            git reset --hard origin/main
            # Пересобираем образ и перезапускаем через чистый docker run
            sudo docker build -t email_notifier_bot_bot .
            sudo docker rm -f email_notifier_bot || true
            sudo docker run -d --name email_notifier_bot --restart unless-stopped -v $(pwd):/app -w /app --env-file .env email_notifier_bot_bot python bot.py
            # Очистка старых образов для экономии места
            sudo docker image prune -f
