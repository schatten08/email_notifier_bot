version: '3.8'

services:
  bot:
    build: .
    container_name: email_notifier_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080
